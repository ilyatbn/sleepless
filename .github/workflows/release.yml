name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -match '(?m)^\s*version\s*=\s*"([^"]+)"') {
            $version = $Matches[1]
          } else {
            throw "Could not find a version in Cargo.toml"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $exe = "target\x86_64-pc-windows-msvc\release\sleepless.exe"
          Copy-Item $exe "dist\sleepless.exe"
          Copy-Item README.md "dist\README.md"
          Compress-Archive -Path "dist\sleepless.exe","dist\README.md" -DestinationPath "dist\sleepless-windows-x86_64.zip"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Sleepless v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/sleepless.exe
            dist/sleepless-windows-x86_64.zip
