[package]
name = "sleepless"
version = "0.2.2-beta.5"
edition = "2021"

[[bin]]
name = "sleepless"
path = "src/main.rs"

# sleepless-gui: tray / menu bar app that launches the CLI. Build it with
# `cargo build -p sleepless-gui` (plain `cargo build` builds just the CLI).
[workspace]
members = ["gui"]

# Embeds assets/icon.ico into sleepless.exe (Windows builds only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# No console window unless /debug is passed and re-attaches one at runtime.
[profile.release]
opt-level = "z"
lto = true
strip = true
# Not `panic = "abort"`: it marks every Rust frame nounwind, which turns any
# Objective-C exception (on macOS) into an abort that cannot be caught by
# `objc2::exception::catch` - that is exactly how two betas died with nothing in
# the log. Unwinding lets the guards work, lets a panic on a helper thread be
# survived, and leaves a usable crash report.
panic = "unwind"

# Salted password hashing for the "come back" prompt (src/lock.rs) plus the OS
# random number generator for its salt. Both are pure Rust and build for every
# platform we ship.
[features]
# Turns an Objective-C exception into a log line instead of an abort. Off by
# default: catching needs an Objective-C compiler for the target
# (objc2-exception-helper), which a Linux cross-build doesn't have, so the
# macOS CI job switches it on.
catch-objc-exceptions = ["objc2/exception"]

[dependencies]
pbkdf2 = { version = "0.13", features = ["sha2"] }
getrandom = "0.4"

# The black full-screen windows and the password prompts on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
# "exception" gives objc2::exception::catch, which turns an Objective-C exception into
# a log line instead of an abort.
objc2 = "0.6"
# LocalAuthentication hands its result back in an Objective-C block.
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSWorkspace",
    "NSSecureTextField",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "block2",
    "NSDate",
    "NSNotification",
    "NSOperation",
    "NSTimer",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSRunLoop",
    "NSString",
] }
# Typed LAContext bindings: -evaluatePolicy:localizedReason:reply: returns void, and only
# the bindings can say so. Needs "block2" for the reply block and "LAPublicDefines"
# for the LAPolicy constants.
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "LAContext",
    "LAPublicDefines",
    "LAError",
    "block2",
] }

[target.'cfg(windows)'.dependencies]
# Raw, 1:1 bindings to the Win32 API - deliberately chosen over the higher
# level `windows` crate so every call here maps directly onto the MSDN
# signatures with no wrapper-type guessing.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
