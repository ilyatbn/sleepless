[package]
name = "sleepless-gui"
version = "0.2.2-beta.7"
edition = "2021"

[[bin]]
name = "sleepless-gui"
path = "src/main.rs"

[features]
# Same as in the main crate: catching an Objective-C exception means compiling a
# small helper (objc2-exception-helper) for the target, which a cross-build from
# Linux can't do. The macOS CI job turns it on for both binaries.
catch-objc-exceptions = ["objc2/exception"]

[dependencies]
# Linux uses the pure D-Bus StatusNotifierItem backend (ksni) instead of
# the default GTK/AppIndicator one, so there are no system libraries to
# install or cross-compile against.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
png = "0.18"
# Ctrl+Cmd+S / Ctrl+Win+S. Pure Rust on Linux too (x11rb talks to the X
# server directly).
global-hotkey = "0.9"

# Embeds assets/icon.ico into sleepless-gui.exe (Windows builds only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSObjectProtocol (respondsToSelector:) so the macOS-14-only message below can
# be probed without a hand-written msg_send! signature.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDate",
    "NSError",
    # -runMode:beforeDate: is gated behind this (its mode argument is a
    # validated NSString wrapper).
    "NSObjCRuntime",
    "NSObject",
    "NSGeometry",
    "NSRunLoop",
    "NSString",
] }
# block2 + local-authentication: the Touch ID prompt is asked here, in the app
# the user just clicked, because a CLI child of a GUI app can't be activated.
block2 = "0.6"
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "LAContext",
    "block2",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAlert",
    "NSApplication",
    "NSControl",
    "NSEvent",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSSecureTextField",
] }
