name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          test -n "$version" || { echo "Could not find a version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\sleepless.exe" "dist\sleepless.exe"
          Copy-Item README.md "dist\README.md"
          Compress-Archive -Path "dist\sleepless.exe","dist\README.md" -DestinationPath "dist\sleepless-windows-x86_64.zip"
          Remove-Item "dist\README.md"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/sleepless \
            target/aarch64-apple-darwin/release/sleepless \
            target/x86_64-apple-darwin/release/sleepless
          lipo -info dist/sleepless

      - name: Build Sleepless.app
        run: packaging/macos/build-app.sh dist/sleepless "${{ needs.version.outputs.version }}" dist

      - name: Stage release artifacts
        run: |
          cp README.md dist/
          cd dist
          # ditto keeps the bundle's signature and permissions intact.
          ditto -c -k --keepParent Sleepless.app sleepless-macos-universal-app.zip
          tar -czf sleepless-macos-universal.tar.gz sleepless README.md
          rm -rf Sleepless.app sleepless README.md

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage release artifacts
        run: |
          name=sleepless-linux-${{ matrix.arch }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/sleepless "dist/$name/"
          cp assets/icon-512.png "dist/$name/sleepless.png"
          cp packaging/linux/sleepless.desktop packaging/linux/install.sh README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    if: github.event_name != 'pull_request'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Sleepless v${{ needs.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
