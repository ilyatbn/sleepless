[package]
name = "sleepless-gui"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "sleepless-gui"
path = "src/main.rs"

[dependencies]
# Linux uses the pure D-Bus StatusNotifierItem backend (ksni) instead of
# the default GTK/AppIndicator one, so there are no system libraries to
# install or cross-compile against.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
png = "0.18"

# Embeds assets/icon.ico into sleepless-gui.exe (Windows builds only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
] }
