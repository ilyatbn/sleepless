[package]
name = "sleepless"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "sleepless"
path = "src/main.rs"

# sleepless-gui: tray / menu bar app that launches the CLI. Build it with
# `cargo build -p sleepless-gui` (plain `cargo build` builds just the CLI).
[workspace]
members = ["gui"]

# Embeds assets/icon.ico into sleepless.exe (Windows builds only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# No console window unless /debug is passed and re-attaches one at runtime.
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

# The black full-screen windows on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSColor",
    "NSCursor",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSGeometry",
] }

[target.'cfg(windows)'.dependencies]
# Raw, 1:1 bindings to the Win32 API - deliberately chosen over the higher
# level `windows` crate so every call here maps directly onto the MSDN
# signatures with no wrapper-type guessing.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
