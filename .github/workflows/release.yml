name: Build and Release

on:
  push:
    # A push to main publishes v<Cargo.toml version>; pushing a tag publishes
    # exactly that tag, which is how a beta (v0.2.2beta1) gets built without
    # pretending the version in Cargo.toml has changed.
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish as a pre-release (e.g. v0.2beta). Leave empty to use v<Cargo.toml version>."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          test -n "$version" || { echo "Could not find a version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --workspace --target x86_64-pc-windows-msvc

      # The only leg that runs the credential store and the Windows registry code
      # on real Windows.
      - name: Unit tests
        run: cargo test -q --workspace

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\sleepless.exe" "dist\sleepless.exe"
          Copy-Item "target\x86_64-pc-windows-msvc\release\sleepless-gui.exe" "dist\sleepless-gui.exe"
          Copy-Item README.md "dist\README.md"
          Compress-Archive -Path "dist\sleepless.exe","dist\sleepless-gui.exe","dist\README.md" -DestinationPath "dist\sleepless-windows-x86_64.zip"
          Remove-Item "dist\README.md"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal binaries
        # catch-objc-exceptions turns an Objective-C exception into a logged
        # failure instead of an abort. It needs an Objective-C compiler for the
        # target, so it can only be built here, on a Mac - hence it's a feature
        # and the macOS job is the one that turns it on.
        run: |
          cargo build --release --workspace --target aarch64-apple-darwin --features sleepless/catch-objc-exceptions,sleepless-gui/catch-objc-exceptions
          cargo build --release --workspace --target x86_64-apple-darwin --features sleepless/catch-objc-exceptions,sleepless-gui/catch-objc-exceptions
          mkdir -p dist
          for bin in sleepless sleepless-gui; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            lipo -info "dist/$bin"
          done

      # The only leg that compiles and runs the macOS backend's own unit tests:
      # `cargo check` never builds test code, and the Linux test leg never
      # compiles src/macos.rs at all - which is how a test calling a function
      # deleted in the same commit survived for weeks.
      - name: Unit tests
        run: cargo test -q --workspace --target aarch64-apple-darwin

      # ...and with exception catching on, which only this platform can build.
      - name: Unit tests (Objective-C exceptions caught)
        run: cargo test -q --no-run --workspace --target aarch64-apple-darwin --features sleepless/catch-objc-exceptions,sleepless-gui/catch-objc-exceptions

      - name: Build Sleepless.app and Sleepless GUI.app
        run: |
          packaging/macos/build-app.sh dist/sleepless "${{ needs.version.outputs.version }}" dist
          packaging/macos/build-gui-app.sh dist/sleepless-gui dist/sleepless "${{ needs.version.outputs.version }}" dist

      - name: Stage release artifacts
        run: |
          cp README.md dist/
          cd dist
          # ditto keeps the bundle's signature and permissions intact.
          ditto -c -k --keepParent Sleepless.app sleepless-macos-universal-app.zip
          ditto -c -k --keepParent "Sleepless GUI.app" sleepless-macos-universal-gui-app.zip
          tar -czf sleepless-macos-universal.tar.gz sleepless sleepless-gui README.md
          rm -rf Sleepless.app "Sleepless GUI.app" sleepless sleepless-gui README.md

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # The credential store, PBKDF2, the back-off and the log file are all
      # platform-independent, so their tests run on the Linux job (once, on the
      # host arch - the aarch64 leg only cross-compiles).
      - name: Unit tests
        if: matrix.arch == 'x86_64'
        run: cargo test --workspace

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Stage release artifacts
        run: |
          name=sleepless-linux-${{ matrix.arch }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/sleepless target/${{ matrix.target }}/release/sleepless-gui "dist/$name/"
          cp assets/icon-512.png "dist/$name/sleepless.png"
          cp packaging/linux/sleepless.desktop packaging/linux/sleepless-gui.desktop packaging/linux/install.sh README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    if: github.event_name != 'pull_request'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Work out which release this run publishes
        id: tag
        run: |
          # A tag push publishes that exact tag; a manual run can name one;
          # a push to main uses v<Cargo.toml version>.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ inputs.tag }}"
            [[ -n "$tag" ]] || tag="v${{ needs.version.outputs.version }}"
          fi
          # Anything carrying a pre-release marker stays off "Latest".
          prerelease=false
          case "$tag" in
            *alpha* | *beta* | *rc* | *pre* | *dev*) prerelease=true ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publishing $tag (pre-release: $prerelease)"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          # A manual run with a custom tag (e.g. a beta from a feature
          # branch) is published as a pre-release on that exact commit and
          # doesn't become "Latest".
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Sleepless ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: dist/*
